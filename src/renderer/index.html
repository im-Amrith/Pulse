<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>Pulse</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- #shell casts the shadow and mood glow; #island is one shape that morphs between capsule and card via clip-path -->
  <div id="shell">
    <div id="island" data-mood="idle">
      <div id="pill">
        <span id="pill-left"></span>
        <span id="pill-lyric"></span>
        <div id="pill-eyes" data-pokeable></div>
        <span id="pill-right"></span>
      </div>

      <section id="panel">
        <nav id="rail">
          <div id="rail-eyes" data-pokeable title="Poke me"></div>
          <div id="rail-pages"></div>
        </nav>
        <div id="main">
          <header id="top">
            <h1 id="title"></h1>
            <svg id="trace" viewBox="0 0 400 30" preserveAspectRatio="none" aria-hidden="true"><path id="trace-path" d=""/></svg>
            <div id="meta"><span id="stats" title="Processor and memory in use"></span><span id="usage" hidden></span><span id="clock"></span><button id="menu-btn" class="iconbtn" title="Menu"></button></div>
          </header>
          <div id="attention"></div>
          <main id="page"></main>
        </div>
        <div id="menu" hidden></div>
      </section>
    </div>
  </div>
  <script src="icons.js"></script>
  <script src="eyes.js"></script>
  <script src="when.js"></script>
  <script src="app.js"></script>
</body>
</html>
