<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>Pulse</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="island" class="pill" data-mood="idle">
    <div id="pill">
      <span id="pill-left"></span>
      <span id="pill-lyric"></span>
      <div id="pill-eyes" data-pokeable></div>
      <span id="pill-right"></span>
    </div>
    <section id="panel">
      <header id="top">
        <div id="title"></div>
        <div id="center"><div id="head-eyes" class="mini" data-pokeable></div><span id="clock"></span></div>
        <div id="right"><span id="usage" hidden></span><button id="menu-btn" class="iconbtn" title="Menu"></button></div>
      </header>
      <div id="attention"></div>
      <main id="page"></main>
      <nav id="nav"></nav>
      <div id="menu" hidden></div>
    </section>
  </div>
  <script src="icons.js"></script>
  <script src="eyes.js"></script>
  <script src="app.js"></script>
</body>
</html>
