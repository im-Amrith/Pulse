<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920, height=1080" />
  <title>Pulse promo</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
  </style>
</head>
<body>
  <div id="root" data-motion-blur="on" data-composition-id="main" data-start="0" data-duration="30" data-width="1920" data-height="1080">
    <div id="stage" data-composition-id="stage" data-composition-src="compositions/stage.html" data-start="0" data-duration="30" data-track-index="0" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
    <div id="type" data-motion-blur="off" data-composition-id="type" data-composition-src="compositions/type.html" data-start="0" data-duration="30" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
        <!-- sound: an original 120 BPM bed (shared/make_audio.py), the app's own chimes, soft ticks on unfold, whooshes on dolly-ins -->
    <audio id="music" class="clip" src="assets/audio/music.wav" data-start="0" data-duration="30" data-track-index="5" data-volume="0.85"></audio>
    <audio id="sfx-whoosh-1" class="clip" src="assets/audio/whoosh-short.mp3" data-start="1.15" data-duration="0.57" data-track-index="6" data-volume="0.45"></audio>
    <audio id="sfx-whoosh-2" class="clip" src="assets/audio/whoosh-short.mp3" data-start="9.85" data-duration="0.57" data-track-index="6" data-volume="0.35"></audio>
    <audio id="sfx-whoosh-3" class="clip" src="assets/audio/whoosh-short.mp3" data-start="15.15" data-duration="0.57" data-track-index="6" data-volume="0.35"></audio>
    <audio id="sfx-whoosh-4" class="clip" src="assets/audio/whoosh-short.mp3" data-start="18.35" data-duration="0.57" data-track-index="6" data-volume="0.35"></audio>
    <audio id="sfx-whoosh-5" class="clip" src="assets/audio/whoosh-short.mp3" data-start="21.05" data-duration="0.57" data-track-index="6" data-volume="0.35"></audio>
    <audio id="sfx-whoosh-6" class="clip" src="assets/audio/whoosh-short.mp3" data-start="24.95" data-duration="0.57" data-track-index="6" data-volume="0.35"></audio>
    <audio id="sfx-whoosh-7" class="clip" src="assets/audio/whoosh-short.mp3" data-start="27.85" data-duration="0.57" data-track-index="6" data-volume="0.45"></audio>
    <audio id="sfx-tick-1" class="clip" src="assets/audio/tick.wav" data-start="9.6" data-duration="0.06" data-track-index="7" data-volume="0.35"></audio>
    <audio id="sfx-tick-2" class="clip" src="assets/audio/tick.wav" data-start="15.3" data-duration="0.06" data-track-index="7" data-volume="0.35"></audio>
    <audio id="sfx-tick-3" class="clip" src="assets/audio/tick.wav" data-start="20.6" data-duration="0.06" data-track-index="7" data-volume="0.35"></audio>
    <audio id="sfx-tick-4" class="clip" src="assets/audio/tick.wav" data-start="18.45" data-duration="0.06" data-track-index="7" data-volume="0.35"></audio>
    <audio id="sfx-ask" class="clip" src="assets/audio/chime-ask.wav" data-start="13.05" data-duration="0.83" data-track-index="8" data-volume="0.3"></audio>
    <audio id="sfx-click" class="clip" src="assets/audio/click-soft.mp3" data-start="17.55" data-duration="0.37" data-track-index="7" data-volume="0.5"></audio>
    <audio id="sfx-allow" class="clip" src="assets/audio/chime-done.wav" data-start="17.6" data-duration="0.72" data-track-index="8" data-volume="0.45"></audio>

  </div>
  <script>
    window.__timelines = window.__timelines || {};
    window.__timelines["main"] = gsap.timeline({ paused: true });
  </script>
</body>
</html>
