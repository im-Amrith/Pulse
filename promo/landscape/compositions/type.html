  <script>
    (() => {
      const tl = gsap.timeline({ paused: true });
      // words slide up out of a mask; they leave as fast as they came
      const show = (id, at, dur, { fast = false, hold = false } = {}) => {
        const lines = `#${id} .in`;
        const inD = fast ? .32 : .5, outD = fast ? .14 : .24;
        tl.fromTo(lines, { yPercent: 115 }, { yPercent: 0, duration: inD, ease: 'expo.out', stagger: fast ? .03 : .07 }, at);
        if (!hold) tl.to(lines, { yPercent: -115, duration: outD, ease: 'power3.in', stagger: .025 }, at + dur - outD - .04);
      };
      show('ty-meet', .45, 2.1);
      show('ty-work', 3.15, 1.85);
      show('ty-check', 5.05, 1.9);
      show('ty-follow', 7.3, 4.4);
      show('ty-asks', 13.2, 1.9);
      show('ty-allow', 15.3, 2.3);
      show('ty-smile', 18.45, 1);
      show('ty-l1', 19.55, 1.9, { fast: true });
      show('ty-l2', 21.5, 0.7, { fast: true });
      show('ty-l3', 22.25, 0.7, { fast: true });
      show('ty-l4', 23, 0.5, { fast: true });
      show('ty-l5', 23.5, 0.5, { fast: true });
      show('ty-l6', 24, 0.95, { fast: true });
      show('ty-desk', 25.1, 1.3);
      show('ty-free', 26.4, 1.45);
      show('ty-end', 27.9, 2.1, { hold: true });
      tl.fromTo('#ty-scrim', { opacity: 0 }, { opacity: 1, duration: .3 }, 3);

      window.__timelines['type'] = tl;
