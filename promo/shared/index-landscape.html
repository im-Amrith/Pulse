<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920, height=1080" />
  <title>Pulse promo</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
  </style>
</head>
<body>
  <div id="root" data-composition-id="main" data-start="0" data-duration="30" data-width="1920" data-height="1080">
    <div id="stage" data-composition-id="stage" data-composition-src="compositions/stage.html" data-start="0" data-duration="30" data-track-index="0" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
    <div id="type" data-composition-id="type" data-composition-src="compositions/type.html" data-start="0" data-duration="30" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
    <!--AUDIO-->
  </div>
  <script>
    window.__timelines = window.__timelines || {};
    window.__timelines["main"] = gsap.timeline({ paused: true });
  </script>
</body>
</html>
