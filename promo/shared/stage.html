  <script>
    (() => {
      const tl = gsap.timeline({ paused: true });
      // Camera: scale s around the frame centre, looking at world point (px, py). World = 1920x1080 with the laptop frontal.
      // A screen point (x, y) in the 1536x864 display sits at world (340 + x*k, 66 + y*k).
      const k = 0.807292, C = [960, 540];
      const W = (x, y) => [340 + x * k, 66 + y * k];
      const cam = (px, py, s) => ({ x: -s * (px - C[0]), y: -s * (py - C[1]), scale: s });
      const go = (at, dur, p, s, ease = 'power3.inOut') => tl.to('#st-cam', { ...cam(p[0], p[1], s), duration: dur, ease }, at);
      const set = (at, p, s) => tl.set('#st-cam', cam(p[0], p[1], s), at);
      const turn = (at, dur, deg, ease = 'power3.inOut') => tl.to('#st-laptop', { rotationY: deg, duration: dur, ease }, at);
      // Framing per layout. Landscape keeps a text column on the left, so the laptop and close-ups sit right of centre;
      // the vertical cut puts text below, so everything is centred. [world x, world y, scale]
      const LAYOUT = 'landscape';
      const F = LAYOUT === 'vertical' ? {
        FULL: [960, 470, 1], WIDE: [850, 480, .9], HOOK: [960, 116, 2.6], END: [960, 116, 2.6], PILL: [960, 110, 2.6],
        PANEL: [960, 215, 1.9], CARD: [950, 175, 1.9], TERM: [1110, 520, 1.75],
      } : {
        FULL: [740, 470, .82], WIDE: [740, 480, .74], HOOK: [960, 130, 2.6], END: [960, 116, 2.6], PILL: [872, 110, 2.6],
        PANEL: [855, 239, 2.2], CARD: [869, 200, 2.4], TERM: [1022, 489, 1.55],
      };
      const g = (at, dur, key, mul = 1, ease) => go(at, dur, F[key].slice(0, 2), F[key][2] * mul, ease);
      const s0 = (at, key, mul = 1) => set(at, F[key].slice(0, 2), F[key][2] * mul);

      // starting state
      tl.set('#st-laptop', { rotationY: 0 }, 0);
      s0(0, 'HOOK');
      tl.fromTo(['#st-sveil', '#st-wveil'], { opacity: 1 }, { opacity: 1, duration: .02 }, 0);
      tl.fromTo('#st-dim', { opacity: .28 }, { opacity: .28, duration: .02 }, 0);

      // 1. hook: a gold spark opens into the pill, then the camera pulls back to a 3/4 laptop
      // (vertical: the spark is already lit on frame 0, because frame 0 is the thumbnail)
      tl.fromTo('#st-spark', { scale: LAYOUT === 'vertical' ? 1 : .2, opacity: LAYOUT === 'vertical' ? 1 : 0 }, { scale: 1.4, opacity: 1, duration: .35, ease: 'power2.out' }, .05);
      tl.to('#st-spark', { scale: 9, scaleY: 1.6, opacity: 0, duration: .45, ease: 'expo.out' }, .4);
      tl.fromTo('#st-hook-wrap', { clipPath: 'inset(27px 356px 529px 356px round 2px)' },
        { clipPath: 'inset(10px 234px 512px 234px round 19px)', duration: .55, ease: 'expo.out' }, .38);
      tl.to('#st-hook-wrap', { clipPath: 'inset(0px 0px 0px 0px round 0px)', duration: .01 }, 1.0);
      tl.to(['#st-wveil', '#st-sveil'], { opacity: 0, duration: 1.0, ease: 'power2.inOut' }, 1.2);
      g(1.2, 1.8, 'WIDE');
