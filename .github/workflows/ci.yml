# Runs the tests on every push and pull request, on Windows, macOS and Linux.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Native media helper compiles
        if: runner.os == 'Windows'
        run: npm run helper
      - name: The app starts (window and hook server)
        if: runner.os != 'Linux'
        shell: bash
        env:
          PULSE_SMOKE_TEST: '1'
        run: |
          npx install-electron
          npx electron . | tee smoke.log
          grep -q PULSE_SMOKE smoke.log
