# Builds the Windows release of Pulse (Pulse-win-x64.zip) on GitHub's Windows machines, the same way
# `npm run release` does on a PC, so anyone can see exactly how a release zip was made.
#
# It never publishes anything. The zip and its .sha256 are uploaded as a workflow artifact; the maintainer
# checks them and publishes the release to im-Amrith/Pulse-releases by hand.
#
# Unsigned for now. scripts/release.js signs automatically when signing is configured (see the top of that file).
name: Windows build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Tests
        run: npm test

      - name: Version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          test "v$VERSION" = "$GITHUB_REF_NAME" || { echo "package.json is $VERSION but the tag is $GITHUB_REF_NAME"; exit 1; }

      - name: Build (npm run release)
        run: npm run release

      - name: Smoke test (start Pulse, check it comes up)
        shell: pwsh
        run: |
          $env:PULSE_SMOKE_TEST = '1'
          # In smoke-test mode Pulse starts everything, then exits 0 only if the hook server and the window came up.
          $p = Start-Process -FilePath 'dist\Pulse\Pulse.exe' -PassThru -RedirectStandardOutput smoke.log -RedirectStandardError smoke-err.log
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw 'Pulse did not exit within 60 s' }
          Get-Content smoke.log -ErrorAction SilentlyContinue | Select-Object -Last 20
          if ($p.ExitCode -ne 0) { Get-Content smoke-err.log -ErrorAction SilentlyContinue | Select-Object -Last 20; throw "Smoke test failed (exit code $($p.ExitCode))" }

      - name: Checksum
        shell: pwsh
        run: Get-Content release\Pulse-win-x64.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: Pulse-win
          path: |
            release/Pulse-win-x64.zip
            release/Pulse-win-x64.zip.sha256
          if-no-files-found: error
